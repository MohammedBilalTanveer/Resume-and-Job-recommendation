services:
  # Backend API (the frontend is deployed separately on Vercel)
  - type: web
    name: intellidiots-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free  # 512 MB RAM: keep ATS_SEMANTIC_MODEL=off here (the model needs ~510 MB)
    healthCheckPath: /health
    envVars:
      # --- required: set these in the Render dashboard ---
      - key: MONGODB_URL          # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: FRONTEND_URL         # e.g. https://intellidiots.vercel.app (no trailing slash)
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- generated / fixed values ---
      - key: SECRET_KEY           # signs login tokens; must stay the same across restarts
        generateValue: true
      - key: JOBS_REFRESH_TOKEN   # copy this value into the GitHub secret JOBS_REFRESH_TOKEN
        generateValue: true
      - key: MONGODB_DB_NAME
        value: resume_ats
      - key: ATS_SEMANTIC_MODEL   # set to "on" on a plan with >= 1 GB RAM for best accuracy
        value: "off"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # --- optional ---
      - key: CORS_ORIGIN_REGEX    # e.g. https://intellidiots-.*\.vercel\.app for preview deployments
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      # OAuth: GOOGLE_CLIENT_API / GOOGLE_SECRET_API / GITHUB_SECRET_KEY are accepted as alternative names
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
